name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      # The end-to-end tests drive real shells. macOS ships zsh and bash 3.2;
      # Linux gets zsh and fish too, so every hook is exercised somewhere.
      - name: Install shells
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish

      - run: pnpm install --frozen-lockfile

      # A fresh install can leave node-pty's spawn helper without its
      # executable bit. Shelly restores it itself before spawning a shell,
      # but the tests also spawn ptys of their own.
      - name: Make node-pty's spawn helper executable
        if: runner.os != 'Windows'
        run: find node_modules/.pnpm -path '*node-pty*' -name spawn-helper -exec chmod +x {} +

      # pnpm 11 refuses to run scripts here because devEngines does not pin
      # its exact version; node --run runs the same scripts with
      # node_modules/.bin on PATH.
      - run: node --run typecheck

      - run: node --run test

      # zsh's system config runs compinit, which stops to ask about
      # "insecure directories" when a completion dir is group-writable, as
      # /usr/share/zsh/vendor-completions is on this runner. Every zsh test
      # would sit at that question, so make them safe the way compaudit asks.
      - name: Secure zsh's completion directories
        if: runner.os == 'Linux'
        run: |
          zsh -fc 'autoload -U compaudit; compaudit' | tail -n +2 | xargs -r sudo chmod g-w,o-w
          zsh -fc 'autoload -U compaudit; compaudit' && echo "No insecure directories left."

      - name: End-to-end tests
        timeout-minutes: 10
        env:
          SHELLY_E2E_SHELLS: ${{ runner.os == 'Linux' && '/usr/bin/fish' || '' }}
        run: node --run test:e2e
